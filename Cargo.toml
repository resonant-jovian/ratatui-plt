[package]
name = "ratatui-plt"
version = "0.0.2"
edition = "2024"
description = "Scientific visualization widgets for ratatui — matplotlib for the terminal"
authors = ["Albin <albin@sjoegren.se>"]
license = "GPL-3.0"
repository = "https://github.com/resonant-jovian/ratatui-plt"
keywords = ["ratatui", "tui", "plotting", "scientific", "visualization"]
categories = ["command-line-interface", "visualization", "science"]

[features]
default = ["crossterm"]
async = ["dep:tokio"]
chrono = ["dep:chrono"]
serde = ["dep:serde"]
fft = ["dep:rustfft"]
triangulation = ["dep:delaunator"]
export = ["dep:resvg", "dep:usvg", "dep:tiny-skia", "dep:svg2pdf", "dep:image"]
statistics = []
kitty = ["export"]
sixel = ["export", "dep:image"]
toml-themes = ["dep:toml", "serde"]
unicode-extended = []

[dependencies]
ratatui = "0.30.0"
palette = "0.7.6"
ordered-float = "5.1.0"
crossterm = { version = "0.29.0", optional = true }

[dependencies.tokio]
version = "1.50.0"
features = ["sync", "time", "rt"]
optional = true

[dependencies.chrono]
version = "0.4.44"
optional = true

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
optional = true

[dependencies.rustfft]
version = "6.4.1"
optional = true

[dependencies.delaunator]
version = "1.0.2"
optional = true

[dependencies.resvg]
version = "0.47.0"
optional = true

[dependencies.usvg]
version = "0.47.0"
optional = true

[dependencies.tiny-skia]
version = "0.12.0"
optional = true

[dependencies.svg2pdf]
version = "0.13.0"
optional = true

[[example]]
name = "statistics"
required-features = ["statistics"]

[[example]]
name = "trendline"
required-features = ["statistics"]

[[example]]
name = "kitty_export"
required-features = ["kitty"]

[[example]]
name = "sixel_export"
required-features = ["sixel"]

[[example]]
name = "toml_theme"
required-features = ["toml-themes"]

[[example]]
name = "showcase_unicode"
required-features = ["unicode-extended"]

[[example]]
name = "showcase_features"
required-features = ["statistics"]

[dependencies.image]
version = "0.25.10"
optional = true
default-features = false
features = ["png"]

[dependencies.toml]
version = "1.1.0"
optional = true

[dev-dependencies]
crossterm = "0.29.0"
color-eyre = "0.6.5"
rand = "0.10.0"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
unwrap_in_result = "forbid"
get_unwrap = "forbid"
panic = "forbid"

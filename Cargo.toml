[package]
name = "ratatui-plt"
version = "0.0.2"
edition = "2024"
description = "Scientific visualization widgets for ratatui — matplotlib for the terminal"
authors = ["Albin <albin@sjoegren.se>"]
license = "GPL-3.0"
repository = "https://github.com/resonant-jovian/ratatui-plt"
keywords = ["ratatui", "tui", "plotting", "scientific", "visualization"]
categories = ["command-line-interface", "visualization", "science"]

[features]
default = []
async = ["dep:tokio"]
chrono = ["dep:chrono"]
serde = ["dep:serde"]
fft = ["dep:rustfft"]
triangulation = ["dep:delaunator"]
export = ["dep:resvg", "dep:usvg", "dep:tiny-skia", "dep:svg2pdf"]
statistics = []

[dependencies]
ratatui = "0.30"
palette = "0.7"
ordered-float = "5"

[dependencies.tokio]
version = "1"
features = ["sync", "time", "rt"]
optional = true

[dependencies.chrono]
version = "0.4"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.rustfft]
version = "6"
optional = true

[dependencies.delaunator]
version = "0.2"
optional = true

[dependencies.resvg]
version = "0.44"
optional = true

[dependencies.usvg]
version = "0.44"
optional = true

[dependencies.tiny-skia]
version = "0.11"
optional = true

[dependencies.svg2pdf]
version = "0.12"
optional = true

[[example]]
name = "export_png_pdf"
required-features = ["export"]

[[example]]
name = "statistics"
required-features = ["statistics"]

[dev-dependencies]
crossterm = "0.29"
color-eyre = "0.6"
rand = "0.10"

[lints.rust]
unsafe_code = "forbid"
warnings = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
unwrap_in_result = "forbid"
get_unwrap = "forbid"
panic = "forbid"
